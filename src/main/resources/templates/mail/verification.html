<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación de correo</title>
    <style>
        body, table, td, a { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: #F6E1C3; }
        img { border: 0; display: block; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #F6E1C3; padding: 20px 0; }
        .main { background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 600px; border-radius: 8px; overflow: hidden; }
        .header { background-color: #82C3A6; text-align: center; padding: 20px; }
        .header img { width: 80px; height: auto; margin: 0 auto; }
        .header h1 { color: #ffffff; font-size: 24px; margin: 12px 0 0; }
        .content { padding: 24px; color: #333333; line-height: 1.6; }
        .content p { margin: 16px 0; font-size: 16px; }
        .button {
            display: inline-block;
            background-color: #F48066;
            color: #ffffff !important;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 6px;
            margin: 16px 0;
        }
        .footer { background-color: #F0F0F0; text-align: center; padding: 12px 24px; font-size: 12px; color: #666666; }
        @media screen and (max-width: 600px) {
            .content, .header, .footer { padding-left: 16px !important; padding-right: 16px !important; }
        }
    </style>
</head>
<body>
<center class="wrapper">
    <table class="main" cellpadding="0" cellspacing="0" role="presentation">
        <!-- Header -->
        <tr>
            <td class="header">
                <img src="cid:logo" alt="Cookit Logo">
                <h1>Verificación de correo</h1>
            </td>
        </tr>
        <!-- Content -->
        <tr>
            <td class="content">
                <p>Hola <strong th:text="${name}">Usuario</strong>,</p>
                <p>Para completar el registro en Cookit, ingresa el siguiente código de verificación:</p>
                <center>
                    <a href="#" class="button" th:text="${code}">123456</a>
                </center>
                <p>Este código expirará en <strong th:text="${hours}">24</strong> horas.</p>
            </td>
        </tr>
        <!-- Footer -->
        <tr>
            <td class="footer">
                Si no solicitaste este correo, puedes ignorarlo sin problema.<br>
                &copy; 2025 Cookit
            </td>
        </tr>
    </table>
</center>
</body>
</html>
